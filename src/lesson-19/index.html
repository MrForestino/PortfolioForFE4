<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <title>Пагінація з попереднім завантаженням сторінок</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Handlebars з CDN (зручно без збирача) -->
  <script src="https://cdn.jsdelivr.net/npm/handlebars@latest/dist/handlebars.min.js"></script>
  <script type="module" crossorigin src="/PortfolioForFE4/assets/lesson19-CK1qd5Zq.js"></script>
  <link rel="modulepreload" crossorigin href="/PortfolioForFE4/assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="stylesheet" crossorigin href="/PortfolioForFE4/assets/lesson19-Ds8Yl4Pi.css">
</head>
<body>
  <header>
    <a href="../../index.html" class="linkBack">↩ go to homepage</a>
  </header>
  <h1>Пагінація локальної бази</h1>

  <div class="controls">
    <label>
      Елементів на сторінку:
      <input id="per-page" type="number" min="1" value="5" />
    </label>

    <label>
      Завантажити сторінок:
      <input id="pages-to-load" type="number" min="1" value="2" />
    </label>

    <button id="fetch">Завантажити</button>
  </div>

  <div class="posts-info">
    <span class="page">Сторінка: 0</span>
    <span class="number-of-pages">з 0</span>
    <span class="number-elements">Завантажено елементів: 0</span>
  </div>

  <ul id="data-list" class="grid"></ul>

  <div class="pager">
    <button id="prev" disabled>← Попередня</button>
    <button id="next" disabled>Наступна →</button>
  </div>

  <!-- Шаблон Handlebars для одного елемента -->
  <script id="item-template" type="text/x-handlebars-template">
    {{#each items}}
  <li>
    <img src="{{webformatURL}}" alt="{{tags}}" width="300" />
    <p>{{#if tags}}{{tags}}{{else}}Без опису{{/if}}</p>
    <p>Автор: {{user}}</p>
    <p><small>ID: {{id}}</small></p>
    <a href="{{pageURL}}" class='check' target="_blank">Переглянути</a>
  </li>
    {{/each}}
  </script>

</body>
</html>
