<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Reverse Timer</title>
  <script type="module" crossorigin src="/PortfolioForFE4/assets/lesson12-dSoeEizX.js"></script>
  <link rel="modulepreload" crossorigin href="/PortfolioForFE4/assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="stylesheet" crossorigin href="/PortfolioForFE4/assets/lesson12-bKDRhJW7.css">
</head>
<body>
	<a href="../../index.html" class="linkBack">↩ go to homepage</a>

	<div class="container">
		<label class="input-label">
            Введіть майбутню дату<i>(більше від сьогоднішньої дати на 1 день)</i> :
    	<input id="target-date" type="datetime-local">
    </label>

		<div class="reverseTimer">
			<div class="timer" id="timer-1">
            <div class="field">
                <span class="label">Days</span>
                <span class="value" data-value="days">--</span>
            </div>
            <div class="field">
                <span class="label">Hours</span>
                <span class="value" data-value="hours">--</span>
            </div>
            <div class="field">
                <span class="label">Minutes</span>
                <span class="value" data-value="mins">--</span>
            </div>
            <div class="field">
                <span class="label">Seconds</span>
                <span class="value" data-value="secs">--</span>
            </div>
        </div>
		</div>
	</div>
</body>
</html>
